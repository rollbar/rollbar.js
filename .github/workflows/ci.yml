name: Rollbar.js CI

on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs the linters directly so the job itself passes or fails. Reporting via
  # separate check runs (e.g. wearerequired/lint-action) needs `checks: write`,
  # which GitHub never grants to pull_request runs from forks, leaving those
  # required checks permanently pending.
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm install
        run: npm install

      - name: ESLint
        run: npm run lint -- --max-warnings 0

      - name: Prettier
        run: npm run format:check

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # `latest` is a floating, non-LTS target used as a forward-compat canary;
    # let it warn without blocking PRs or (with fail-fast off) cancelling the
    # supported legs.
    continue-on-error: ${{ matrix.node == 'latest' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20
            npm: ^10
          - node: 22
            npm: ^10
          - node: 24
            npm: ^11
          - node: latest
            npm: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Update npm
        run: npm install -g npm@${{ matrix.npm }}

      - name: npm install
        run: npm install

      - name: Build
        run: npm run build

      - name: Validate ES5 compatibility
        run: npm run validate:es5

      - name: Run server tests
        run: npm run test:server

      - name: Run React Native tests
        run: npm run test:react-native

      # Browser tests launch chromium; the harness Node version is irrelevant to
      # browser coverage, so run them on a single leg. Node 22 because
      # @web/test-runner 1.x requires Node >= 22, and the chromium download in
      # `playwright install` stalls indefinitely on Node 24/latest.
      - name: Install Playwright browsers
        if: matrix.node == 22
        # The chromium download can stall; cap each attempt and retry so a
        # transient stall doesn't hang the job until the timeout.
        run: |
          for i in 1 2 3; do
            timeout 300 npx playwright install chromium && exit 0
            echo "playwright install attempt $i stalled or failed; retrying"
          done
          exit 1

      # test/examples/ loads these apps' bundles, so build them from the SDK
      # the Build step just produced instead of committing stale copies.
      - name: Build example apps for browser tests
        if: matrix.node == 22
        run: npm run build:test-examples

      - name: Run browser tests (Web Test Runner)
        if: matrix.node == 22
        run: npm run test:wtr

      - name: Validate examples
        run: npm run validate:examples
